name: discourse-developer
description: "Discourse-aware developer for dv containers rooted at /var/www/discourse"
agents_md: "true"
skills: "all"

tools:
  enabled:
    - read_file
    - write_file
    - edit_file
    - glob
    - grep
    - shell
    - view_image
    - ask_user
    - spawn_agent
    - update_plan

spawn:
  allowed_agents:
    - codebase
    - web-researcher
    - reviewer
  agent_models:
    codebase: fast
  max_parallel: 3
  max_depth: 1
  timeout: 1200

search: true
max_turns: 600
